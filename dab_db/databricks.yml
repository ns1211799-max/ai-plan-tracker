# This is a Declarative Automation Bundle definition for dab_db.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_db
  uuid: 7b009ce7-a043-4dd6-a077-4a1f9ba36bf0

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-8cb65346-aa09.cloud.databricks.com
    variables:
      catalog: poc_fullload
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-8cb65346-aa09.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/ns1211799@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/ns1211799@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: poc_fullload
      schema: prod
    permissions:
      - user_name: ns1211799@gmail.com
        level: CAN_MANAGE
