# A sample job for dab_db.

resources:
  jobs:
    sample_job:
      name: sample_job

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: /Workspace/Users/ns1211799@gmail.com/ai-plan-tracker/dab_db/src/bronze/01_bronze_export
            source: WORKSPACE
        - task_key: silver_landing
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: /Workspace/Users/ns1211799@gmail.com/ai-plan-tracker/dab_db/src/silver_landing/02_silver_landing
            source: WORKSPACE
        - task_key: silver_merge
          depends_on:
            - task_key: silver_landing
          notebook_task:
            notebook_path: /Workspace/Users/ns1211799@gmail.com/ai-plan-tracker/dab_db/src/silver_merge/04_silver_landing_merge
            source: WORKSPACE
        - task_key: silver_unification
          depends_on:
            - task_key: silver_merge
          notebook_task:
            notebook_path: /Workspace/Users/ns1211799@gmail.com/ai-plan-tracker/dab_db/src/silver_unification/05_silver_unification
            source: WORKSPACE
        - task_key: gold
          depends_on:
            - task_key: silver_unification
          notebook_task:
            notebook_path: /Workspace/Users/ns1211799@gmail.com/ai-plan-tracker/dab_db/src/gold/06_gold_refinement
            source: WORKSPACE
          python_wheel_task:
            package_name: dab_db
            entry_point: main
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.schema}"
          environment_key: default
        - task_key: refresh_pipeline
          depends_on:
            - task_key: notebook_task
          pipeline_task:
            pipeline_id: ${resources.pipelines.dab_db_etl.id}

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              # By default we just include the .whl file generated for the dab_db package.
              # See https://docs.databricks.com/dev-tools/bundles/library-dependencies.html
              # for more information on how to add other libraries.
              - ../dist/*.whl
